services:
  # Optimized Python Face Recognition Service
  - type: web
    name: face-recognition-service-optimized
    env: python
    plan: starter
    buildCommand: |
      # Install system dependencies first
      apt-get update && apt-get install -y --no-install-recommends \
        libgl1-mesa-glx \
        libglib2.0-0 \
        libsm6 \
        libxext6 \
        libxrender-dev \
        libgomp1 \
        && rm -rf /var/lib/apt/lists/*
      
      # Install Python dependencies with optimizations
      pip install --no-cache-dir --compile -r requirements-light.txt
    startCommand: python face_recognition_service_light.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
    buildFilter:
      paths:
        - requirements-light.txt
        - face_recognition_service_light.py
        - "*.py"
      ignorePaths:
        - venv/
        - __pycache__/
        - .git/
        - node_modules/
        - dist/
        - temp/

  # Express.js Backend Service (unchanged)
  - type: web
    name: gym-sass-backend
    env: node
    plan: starter
    buildCommand: npm ci --only=production && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PYTHON_FACE_SERVICE_URL
        value: https://face-recognition-service-optimized.onrender.com 